# CI: the cpu's work only (the user's call, 2026-11-06: the client's gpu workloads are too heavy for a hosted runner's
# software Vulkan): setup, the profile, debug and release builds (the user's ask, 2026-11-07), and scripts/assettest.ps1's
# checks without -Client (the importers, images, environments, the lens check) on the profile build. macOS, Windows and
# Linux, which the shared vcpkg binary cache (docs/notes/build.md) holds packages for: setup restores them, LLVM too, rather
# than build them on a hosted runner. A job per platform builds the three configurations in turn: their packages are the
# same (each holds its debug and release builds), and a job per configuration would restore them, about 2 GB, three times.
#
# The cache is written too where the repository holds a B2 application key (the user's ask, 2026-11-08): the secrets
# B2_APPLICATION_KEY_ID and B2_APPLICATION_KEY, a key for the bucket's speedo/vcpkg/ prefix alone, read, write and delete.
# Never in a pull request's run: setup adds vcpkg's x-aws source (scripts/binarycache.ps1), which uploads what a runner
# builds, and after a push whose jobs all passed the prune job deletes what no platform installs any more. Without the
# secrets, every run reads the cache only.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  SPEEDO_BINARY_CACHE_WRITE: ${{ github.event_name != 'pull_request' && secrets.B2_APPLICATION_KEY_ID != '' && '1' || '' }}
  AWS_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.B2_APPLICATION_KEY_ID || '' }}
  AWS_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.B2_APPLICATION_KEY || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64
    # GitHub's Xcode 27 image: macOS 27 on Apple silicon, whose SDK's major version is the deployment target the cache's
    # packages are keyed by (macos-latest and macos-26 are macOS 26: every package would be built)
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      TRIPLET: arm64-osx-clang
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # the quick tier's test assets, kept between runs (800 MB from their sites otherwise), in the runner's temporary dir
      # (the cache rejects a path with '..', so beside the checkout didn't save). The vcpkg packages come from the shared
      # cache each run, 1.5 GB: vcpkg doesn't keep what it restored from it in its local archives, so caching those here
      # would keep nothing
      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/test-assets
          key: test-assets-${{ hashFiles('resources/test-asset-manifests/**', 'scripts/fetch-test-assets.ps1') }}
          restore-keys: test-assets-

      # setup.ps1 directly: setup_osx.sh only installs PowerShell (the image has it) and upgrades all of Homebrew
      - name: Setup
        id: setup
        run: ./setup.ps1

      - name: Build profile
        id: profile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-profile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-profile"

      - name: Build debug
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-debug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-debug"

      - name: Build release
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-release"

      # on the profile build, whatever became of the others
      - name: Asset checks
        if: ${{ !cancelled() && steps.profile.outcome == 'success' }}
        env:
          SPEEDO_TEST_ASSETS: ${{ runner.temp }}/test-assets
        run: |
          $paths = & scripts/fetch-test-assets.ps1 -Minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/assettest.ps1 -Preset "$env:TRIPLET-profile" -Work "$env:RUNNER_TEMP/assettest" @paths

      # the packages this platform installs (the three configurations share them), which the prune job keeps
      - name: Keep list
        if: ${{ github.event_name == 'push' && env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        run: ./scripts/prune-binary-cache.ps1 -WriteKeepList "$env:RUNNER_TEMP/abis-macos.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        with:
          name: abis-macos
          path: ${{ runner.temp }}/abis-macos.txt
          retention-days: 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-macos
          path: |
            vcpkg/buildtrees/*/*.log
            ${{ runner.temp }}/assettest/logs
          if-no-files-found: ignore

  windows:
    name: Windows x64
    # GitHub's Windows Server 2025 image with Visual Studio 2026 (its components and Windows 11 SDK 26100 are what setup
    # requires, and its CMake is new enough; it has no winget, which setup only needs to install what is missing). The
    # packages' hashes don't track the toolset or SDK versions (docs/notes/build.md), so it restores those built with VS 2022
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      TRIPLET: x64-windows-clang
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # as macOS's (actions/cache keeps each OS's apart)
      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/test-assets
          key: test-assets-${{ hashFiles('resources/test-asset-manifests/**', 'scripts/fetch-test-assets.ps1') }}
          restore-keys: test-assets-

      # setup.ps1 directly: setup_windows.bat only installs PowerShell, which the image has
      - name: Setup
        id: setup
        run: ./setup.ps1

      - name: Build profile
        id: profile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-profile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-profile"

      - name: Build debug
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-debug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-debug"

      - name: Build release
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-release"

      - name: Asset checks
        if: ${{ !cancelled() && steps.profile.outcome == 'success' }}
        env:
          SPEEDO_TEST_ASSETS: ${{ runner.temp }}/test-assets
        run: |
          $paths = & scripts/fetch-test-assets.ps1 -Minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/assettest.ps1 -Preset "$env:TRIPLET-profile" -Work "$env:RUNNER_TEMP/assettest" @paths

      - name: Keep list
        if: ${{ github.event_name == 'push' && env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        run: ./scripts/prune-binary-cache.ps1 -WriteKeepList "$env:RUNNER_TEMP/abis-windows.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        with:
          name: abis-windows
          path: ${{ runner.temp }}/abis-windows.txt
          retention-days: 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-windows
          path: |
            vcpkg/buildtrees/*/*.log
            ${{ runner.temp }}/assettest/logs
          if-no-files-found: ignore

  linux:
    name: Linux x64
    # GitHub's Ubuntu 26.04 image, by its own label: the cache's Linux packages are keyed by the C library's version
    # (GLIBC_VERSION, 2.43 there), and ubuntu-latest moves from 24.04 (2.39) to 26.04 over November and December 2026
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      TRIPLET: x64-linux-clang
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/test-assets
          key: test-assets-${{ hashFiles('resources/test-asset-manifests/**', 'scripts/fetch-test-assets.ps1') }}
          restore-keys: test-assets-

      # setup.ps1 directly (setup_linux.sh only installs PowerShell, which the image has), after apt's package lists, which
      # the image's may predate: linux.ps1 installs what the image lacks
      - name: Setup
        id: setup
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./setup.ps1

      - name: Build profile
        id: profile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-profile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-profile"

      - name: Build debug
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-debug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-debug"

      - name: Build release
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cmake --preset "$env:TRIPLET-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build/$env:TRIPLET-release"

      - name: Asset checks
        if: ${{ !cancelled() && steps.profile.outcome == 'success' }}
        env:
          SPEEDO_TEST_ASSETS: ${{ runner.temp }}/test-assets
        run: |
          $paths = & scripts/fetch-test-assets.ps1 -Minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/assettest.ps1 -Preset "$env:TRIPLET-profile" -Work "$env:RUNNER_TEMP/assettest" @paths

      - name: Keep list
        if: ${{ github.event_name == 'push' && env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        run: ./scripts/prune-binary-cache.ps1 -WriteKeepList "$env:RUNNER_TEMP/abis-linux.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        with:
          name: abis-linux
          path: ${{ runner.temp }}/abis-linux.txt
          retention-days: 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-linux
          path: |
            vcpkg/buildtrees/*/*.log
            ${{ runner.temp }}/assettest/logs
          if-no-files-found: ignore

  # the shared cache's archives that no platform installs any more (scripts/prune-binary-cache.ps1), after a push to master
  # whose jobs all passed: by the three platforms' lists, sparing what was uploaded in the last week (a maintainer's packages
  # for a change not pushed yet, which a runner would build again once it is). With more than half of the bucket stale (a
  # toolchain change) the script refuses, and this job fails: prune that by hand, with -Force
  prune:
    name: Prune binary cache
    needs: [macos, windows, linux]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.SPEEDO_BINARY_CACHE_WRITE != '' }}

      - uses: actions/download-artifact@v8
        if: ${{ env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        with:
          pattern: abis-*
          path: ${{ runner.temp }}/abis
          merge-multiple: true

      - name: Prune
        if: ${{ env.SPEEDO_BINARY_CACHE_WRITE != '' }}
        run: |
          $lists = @('macos', 'windows', 'linux') | ForEach-Object { "$env:RUNNER_TEMP/abis/abis-$_.txt" }
          ./scripts/prune-binary-cache.ps1 -Keep $lists -MinAgeDays 7
